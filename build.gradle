plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

sourceCompatibility = 11
targetCompatibility = 11

compileTestJava {
    options.compilerArgs += '-parameters'
}

test {
    useJUnitPlatform()
}

javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.runtimeClasspath
    destinationDir = file('javadoc')
}

//group 'com.khiops'
//version '1.0-SNAPSHOT'

dependencies {
    implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '4.30.2'
    implementation group: 'com.google.protobuf', name: 'protobuf-java-util', version: '4.30.2'
    implementation 'org.json:json:20240303'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2' // Use the latest version available
  	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.5.1'
}

sourceSets {
    main {
        java {
            srcDirs('gen/java')
        }
        resources {
            srcDirs('gen/resources')
        }
    }
    test {
        java {
            srcDirs('gen/java', 'src/test')
        }
    }
}
