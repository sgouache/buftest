  // If ``True`` detects automatically whether the data table file has a header and its field separator. It is set to ``False`` if ``header_line`` or ``field_separator`` are set.
  optional bool detect_format = 12 [default = true];

  // If ``True`` it uses the first line of the data as column names. Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
  optional bool header_line = 13;

  oneof field_separator_option {
    // A field separator character. \"\" has the same effect as \"\\t\". Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
    string field_separator = 14 [default = "None"];
    // A field separator character. \"\" has the same effect as \"\\t\". Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
    bytes bytes_field_separator = 15;
  }

  // See ``sampling_mode`` option below.
  optional float sample_percentage = 16 [default = 100.0];

  oneof sampling_mode_option {
    // If equal to \"Include sample\" it trains the coclustering estimator on ``sample_percentage`` percent of the data. If equal to \"Exclude sample\" it trains the coclustering estimator on the complement of the data selected with \"Include sample\". See also :ref:`core-api-sampling-mode`.
    string sampling_mode = 17 [default = "Include sample"];
