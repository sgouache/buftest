syntax = "proto2";

package khiops.v11;
option java_package = "org.khiops";
option go_package = "khiops.org/proto/khiops";

/*
 Trains a recoding model from a data table
 
 A recoding model consists in the discretization of numerical variables and the
 grouping of categorical variables.
 
 If the ``target_variable`` is specified these partitions are constructed in
 supervised mode, meaning that each resulting discretizations/groupings best
 separates the target variable while maintaining a simple interval/group model of the
 data. Different recoding methods can be specified via the
 ``numerical_recoding_method``, ``categorical_recoding_method`` and
 ``pairs_recoding_method`` options.
 
 The output files of this process contain a dictionary file (``.kdic``) that can be
 used to recode databases with the `deploy_model` function.
 */
message TrainRecoder {

  oneof dictionary_file_path_option {
    // Path of a Khiops dictionary file.
    string dictionary_file_path = 1 [default = ""];
    // Path of a Khiops dictionary file.
    bytes bytes_dictionary_file_path = 2;
  }

  oneof dictionary_name_option {
    // Name of the dictionary to be recoded.
    string dictionary_name = 3 [default = ""];
    // Name of the dictionary to be recoded.
    bytes bytes_dictionary_name = 4;
  }

  oneof data_table_path_option {
    // Path of the data table file.
    string data_table_path = 5 [default = ""];
    // Path of the data table file.
    bytes bytes_data_table_path = 6;
  }

  oneof target_variable_option {
    // Name of the target variable. If equal to \"\" it trains an unsupervised recoder.
    string target_variable = 7 [default = ""];
    // Name of the target variable. If equal to \"\" it trains an unsupervised recoder.
    bytes bytes_target_variable = 8;
  }

  oneof analysis_report_file_path_option {
    // Path to the analysis report file in the JSON format. An additional dictionary file with the same name and extension ``.model.kdic`` is built, which contains the trained recoding model.
    string analysis_report_file_path = 9 [default = ""];
    // Path to the analysis report file in the JSON format. An additional dictionary file with the same name and extension ``.model.kdic`` is built, which contains the trained recoding model.
    bytes bytes_analysis_report_file_path = 10;
  }

  // If ``True`` detects automatically whether the data table file has a header and its field separator. It is set to ``False`` if ``header_line`` or ``field_separator`` are set.
  optional bool detect_format = 11 [default = true];

  // If ``True`` it uses the first line of the data as column names. Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
  optional bool header_line = 12;

  oneof field_separator_option {
    // A field separator character. \"\" has the same effect as \"\\t\". Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
    string field_separator = 13 [default = "None"];
    // A field separator character. \"\" has the same effect as \"\\t\". Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
    bytes bytes_field_separator = 14;
  }

  // See ``sampling_mode`` option below.
  optional float sample_percentage = 15 [default = 100.0];

  oneof sampling_mode_option {
    // If equal to \"Include sample\" it trains the recoder on ``sample_percentage`` percent of the data. If equal to \"Exclude sample\" it trains the recoder on the complement of the data selected with \"Include sample\". See also :ref:`core-api-sampling-mode`.
    string sampling_mode = 16 [default = "Include sample"];
    // If equal to \"Include sample\" it trains the recoder on ``sample_percentage`` percent of the data. If equal to \"Exclude sample\" it trains the recoder on the complement of the data selected with \"Include sample\". See also :ref:`core-api-sampling-mode`.
    bytes bytes_sampling_mode = 17;
  }

  oneof selection_variable_option {
    // It trains with only the records such that the value of ``selection_variable`` is equal to ``selection_value``. Ignored if equal to \"\".
    string selection_variable = 18 [default = ""];
    // It trains with only the records such that the value of ``selection_variable`` is equal to ``selection_value``. Ignored if equal to \"\".
    bytes bytes_selection_variable = 19;
  }

  oneof selection_value_option {
    // See ``selection_variable`` option above. Ignored if equal to \"\".
    string selection_value = 20 [default = ""];
    // See ``selection_variable`` option above. Ignored if equal to \"\".
    bytes bytes_selection_value = 21;
  }

  // A list of tuples containing the data paths and file paths for a multi-table dictionary file. For more details see :doc:`/multi_table_primer`.
  message TrainRecoderAdditionalDataTablesTuple {
    oneof data_path_option {
      // Data path of the data table.
      string data_path = 22 [default = ""];
      // Data path of the data table.
      bytes bytes_data_path = 23;
    }
    oneof file_path_option {
      // Path of the data table file.
      string file_path = 24 [default = ""];
      // Path of the data table file.
      bytes bytes_file_path = 25;
    }
  }

  repeated TrainRecoderAdditionalDataTablesTuple additional_data_tables = 26;

  // Maximum number of variables to construct.
  optional int32 max_constructed_variables = 27 [default = 100];

  // Allowed rules for the automatic variable construction. If not set it uses all possible rules.
  message TrainRecoderConstructionRulesTuple {
    oneof name_option {
      // Name of the construction rule.
      string name = 28 [default = ""];
      // Name of the construction rule.
      bytes bytes_name = 29;
    }
  }

  repeated TrainRecoderConstructionRulesTuple construction_rules = 30;

  // Maximum number of text features to construct.
  optional int32 max_text_features = 31 [default = 10000];

  oneof text_features_option {
    // Type of the text features. Can be either one of: - \"words\": sequences of non-space characters - \"ngrams\": sequences of bytes - \"tokens\": user-defined.
    string text_features = 32 [default = "words"];
    // Type of the text features. Can be either one of: - \"words\": sequences of non-space characters - \"ngrams\": sequences of bytes - \"tokens\": user-defined.
    bytes bytes_text_features = 33;
  }

  // Maximum number of trees to construct.
  optional int32 max_trees = 34 [default = 10];

  // Maximum number of variables pairs to construct.
  optional int32 max_pairs = 35 [default = 0];

  // If ``True`` tries to create all possible pairs within the limit ``max_pairs``. Pairs specified with ``specific_pairs`` have top priority: they are constructed first.
  optional bool all_possible_pairs = 36 [default = true];

  // User-specified pairs as a list of 2-tuples of feature names. If a given tuple contains only one non-empty feature name, then it generates all the pairs containing it (within the maximum limit ``max_pairs``). These pairs have top priority: they are constructed first.
  message TrainRecoderSpecificPairsTuple {
    oneof first_name_option {
      // Name of the first variable in the pair
      string first_name = 37 [default = ""];
      // Name of the first variable in the pair
      bytes bytes_first_name = 38;
    }
    oneof second_name_option {
      // Name of the second variable in the pair
      string second_name = 39 [default = ""];
      // Name of the second variable in the pair
      bytes bytes_second_name = 40;
    }
  }

  repeated TrainRecoderSpecificPairsTuple specific_pairs = 41;

  // If ``True`` keeps only informative variables.
  optional bool informative_variables_only = 42 [default = true];

  // Maximum number of variables to keep. If equal to 0 keeps all variables.
  optional int32 max_variables = 43 [default = 0];

  // If ``True`` keeps the initial categorical variables.
  optional bool keep_initial_categorical_variables = 44 [default = false];

  // If ``True`` keeps initial numerical variables.
  optional bool keep_initial_numerical_variables = 45 [default = false];

  oneof categorical_recoding_method_option {
    // Type of recoding for categorical variables. Types available: - \"part Id\" (default): An id for the interval/group - \"part label\": A label for the interval/group - \"0-1 binarization\": A 0's and 1's coding the interval/group id - \"conditional info\": Conditional information of the interval/group - \"none\": Keeps the variable as-is.
    string categorical_recoding_method = 46 [default = "part Id"];
    // Type of recoding for categorical variables. Types available: - \"part Id\" (default): An id for the interval/group - \"part label\": A label for the interval/group - \"0-1 binarization\": A 0's and 1's coding the interval/group id - \"conditional info\": Conditional information of the interval/group - \"none\": Keeps the variable as-is.
    bytes bytes_categorical_recoding_method = 47;
  }

  oneof numerical_recoding_method_option {
    // Type of recoding recoding for numerical variables. Types available: - \"part Id\" (default): An id for the interval/group - \"part label\": A label for the interval/group - \"0-1 binarization\": A 0's and 1's coding the interval/group id - \"conditional info\": Conditional information of the interval/group - \"center-reduction\": \"(X - Mean(X)) / StdDev(X)\" - \"0-1 normalization\": \"(X - Min(X)) / (Max(X) - Min(X))\" - \"rank normalization\": mean normalized rank (between 0 and 1) of the instances - \"none\": Keeps the variable as-is.
    string numerical_recoding_method = 48 [default = "part Id"];
    // Type of recoding recoding for numerical variables. Types available: - \"part Id\" (default): An id for the interval/group - \"part label\": A label for the interval/group - \"0-1 binarization\": A 0's and 1's coding the interval/group id - \"conditional info\": Conditional information of the interval/group - \"center-reduction\": \"(X - Mean(X)) / StdDev(X)\" - \"0-1 normalization\": \"(X - Min(X)) / (Max(X) - Min(X))\" - \"rank normalization\": mean normalized rank (between 0 and 1) of the instances - \"none\": Keeps the variable as-is.
    bytes bytes_numerical_recoding_method = 49;
  }

  oneof pairs_recoding_method_option {
    // Type of recoding for bivariate variables. Types available: - \"part Id\" (default): An id for the interval/group - \"part label\": A label for the interval/group - \"0-1 binarization\": A 0's and 1's coding the interval/group id - \"conditional info\": Conditional information of the interval/group - \"none\": Keeps the variable as-is.
    string pairs_recoding_method = 50 [default = "part Id"];
    // Type of recoding for bivariate variables. Types available: - \"part Id\" (default): An id for the interval/group - \"part label\": A label for the interval/group - \"0-1 binarization\": A 0's and 1's coding the interval/group id - \"conditional info\": Conditional information of the interval/group - \"none\": Keeps the variable as-is.
    bytes bytes_pairs_recoding_method = 51;
  }

  // Allows grouping of the target variable values in classification. It can substantially increase the training time.
  optional bool group_target_value = 52 [default = false];

  oneof discretization_method_option {
    // Name of the discretization method, for unsupervised analysis only. Its valid values are: \"MODL\" (default), \"EqualWidth\", \"EqualFrequency\" or \"None\". Ignored for supervised analysis.
    string discretization_method = 53 [default = "None"];
    // Name of the discretization method, for unsupervised analysis only. Its valid values are: \"MODL\" (default), \"EqualWidth\", \"EqualFrequency\" or \"None\". Ignored for supervised analysis.
    bytes bytes_discretization_method = 54;
  }

  oneof grouping_method_option {
    // Name of the grouping method, for unsupervised analysis only. Its valid values are: \"MODL\" (default), \"BasicGrouping\" or \"None\". Ignored for supervised analysis.
    string grouping_method = 55 [default = "None"];
    // Name of the grouping method, for unsupervised analysis only. Its valid values are: \"MODL\" (default), \"BasicGrouping\" or \"None\". Ignored for supervised analysis.
    bytes bytes_grouping_method = 56;
  }

  // Maximum number of variable parts produced by preprocessing methods. If equal to 0 it is automatically calculated. Special default values for unsupervised analysis: - If ``discretization_method`` is \"EqualWidth\" or \"EqualFrequency\": 10 - If ``grouping_method`` is \"BasicGrouping\": 10.
  optional int32 max_parts = 57 [default = 0];

  oneof log_file_path_option {
    // Path of the log file for the Khiops process (command line option ``-e`` of the desktop app). If equal to \"\" then it writes no log file.
    string log_file_path = 58 [default = "None"];
    // Path of the log file for the Khiops process (command line option ``-e`` of the desktop app). If equal to \"\" then it writes no log file.
    bytes bytes_log_file_path = 59;
  }

  oneof output_scenario_path_option {
    // Path of the output Khiops scenario file (command line option ``-o`` of the desktop app).  If the empty string is specified no output scenario file is generated.
    string output_scenario_path = 60 [default = "None"];
    // Path of the output Khiops scenario file (command line option ``-o`` of the desktop app).  If the empty string is specified no output scenario file is generated.
    bytes bytes_output_scenario_path = 61;
  }

  oneof task_file_path_option {
    // Path of the task file for the Khiops process (command line option ``-p`` of the desktop app). If equal to \"\" then it writes no task file.
    string task_file_path = 62 [default = "None"];
    // Path of the task file for the Khiops process (command line option ``-p`` of the desktop app). If equal to \"\" then it writes no task file.
    bytes bytes_task_file_path = 63;
  }

  // If True prints the command line executed of the process and does not delete any temporary files created.
  optional bool trace = 64 [default = false];

  oneof stdout_file_path_option {
    // *Advanced* Path to a file where the Khiops process writes its stdout stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    string stdout_file_path = 65 [default = ""];
    // *Advanced* Path to a file where the Khiops process writes its stdout stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    bytes bytes_stdout_file_path = 66;
  }

  oneof stderr_file_path_option {
    // *Advanced* Path to a file where the Khiops process writes its stderr stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    string stderr_file_path = 67 [default = ""];
    // *Advanced* Path to a file where the Khiops process writes its stderr stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    bytes bytes_stderr_file_path = 68;
  }

  // *Advanced* Maximum number of cores for Khiops executions. If not set, then Khiops uses all available CPU cores in the system.
  optional int32 max_cores = 690;

  // *Advanced* Maximum amount of memory (in MB) for Khiops executions. If not set, then Khiops uses all available system memory.
  optional int32 memory_limit_mb = 700;

  oneof temp_dir_option {
    // *Advanced* Temporary directory for Khiops executions. If set to \"\", then Khiops uses the system's temporary directory.
    string temp_dir = 71 [default = ""];
    // *Advanced* Temporary directory for Khiops executions. If set to \"\", then Khiops uses the system's temporary directory.
    bytes bytes_temp_dir = 72;
  }

  oneof scenario_prologue_option {
    // *Advanced* Prologue to prepend to all Khiops execution scenarios.
    string scenario_prologue = 73 [default = ""];
    // *Advanced* Prologue to prepend to all Khiops execution scenarios.
    bytes bytes_scenario_prologue = 74;
  }

}

/*
 Deploys a model on a data table
 */
message DeployModel {

  oneof dictionary_file_path_option {
    // Path of a Khiops dictionary file.
    string dictionary_file_path = 1 [default = ""];
    // Path of a Khiops dictionary file.
    bytes bytes_dictionary_file_path = 2;
  }

  oneof dictionary_name_option {
    // Name of the dictionary to be analyzed.
    string dictionary_name = 3 [default = ""];
    // Name of the dictionary to be analyzed.
    bytes bytes_dictionary_name = 4;
  }

  oneof data_table_path_option {
    // Path of the data table file.
    string data_table_path = 5 [default = ""];
    // Path of the data table file.
    bytes bytes_data_table_path = 6;
  }

  oneof output_data_table_path_option {
    // Path of the output data file.
    string output_data_table_path = 7 [default = ""];
    // Path of the output data file.
    bytes bytes_output_data_table_path = 8;
  }

  // If ``True`` detects automatically whether the data table file has a header and its field separator. It is set to ``False`` if ``header_line`` or ``field_separator`` are set.
  optional bool detect_format = 9 [default = true];

  // If ``True`` it uses the first line of the data as column names. Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
  optional bool header_line = 10;

  oneof field_separator_option {
    // A field separator character. \"\" has the same effect as \"\\t\". Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
    string field_separator = 11 [default = "None"];
    // A field separator character. \"\" has the same effect as \"\\t\". Sets ``detect_format`` to ``False`` if set. Ignored if ``detect_format`` is ``True``.
    bytes bytes_field_separator = 12;
  }

  // See ``sampling_mode`` option below.
  optional float sample_percentage = 13 [default = 100.0];

  oneof sampling_mode_option {
    // If equal to \"Include sample\" it deploys the model on ``sample_percentage`` percent of the data. If equal to \"Exclude sample\" it deploys the model on the complement of the data selected with \"Include sample\". See also :ref:`core-api-sampling-mode`.
    string sampling_mode = 14 [default = "Include sample"];
    // If equal to \"Include sample\" it deploys the model on ``sample_percentage`` percent of the data. If equal to \"Exclude sample\" it deploys the model on the complement of the data selected with \"Include sample\". See also :ref:`core-api-sampling-mode`.
    bytes bytes_sampling_mode = 15;
  }

  oneof selection_variable_option {
    // It deploys only the records such that the value of ``selection_variable`` is equal to ``selection_value``. Ignored if equal to \"\".
    string selection_variable = 16 [default = ""];
    // It deploys only the records such that the value of ``selection_variable`` is equal to ``selection_value``. Ignored if equal to \"\".
    bytes bytes_selection_variable = 17;
  }

  oneof selection_value_option {
    // See ``selection_variable`` option above. Ignored if equal to \"\".
    string selection_value = 18 [default = ""];
    // See ``selection_variable`` option above. Ignored if equal to \"\".
    bytes bytes_selection_value = 19;
  }

  // A list of tuples containing the data paths and file paths for a multi-table dictionary file. For more details see :doc:`/multi_table_primer`.
  message DeployModelAdditionalDataTablesTuple {
    oneof data_path_option {
      // Data path of the data table.
      string data_path = 20 [default = ""];
      // Data path of the data table.
      bytes bytes_data_path = 21;
    }
    oneof file_path_option {
      // Path of the data table file.
      string file_path = 22 [default = ""];
      // Path of the data table file.
      bytes bytes_file_path = 23;
    }
  }

  repeated DeployModelAdditionalDataTablesTuple additional_data_tables = 24;

  // If ``True`` writes a header line with the column names in the output table.
  optional bool output_header_line = 25 [default = true];

  oneof output_field_separator_option {
    // The field separator character for the output table (\"\" counts as \"\\t\").
    string output_field_separator = 26 [default = "	"];
    // The field separator character for the output table (\"\" counts as \"\\t\").
    bytes bytes_output_field_separator = 27;
  }

  // A list of tuples containing the output data paths and file paths for a multi-table dictionary file. For more details see :doc:`/multi_table_primer`.
  message DeployModelOutputAdditionalDataTablesTuple {
    oneof data_path_option {
      // Data path of the data table.
      string data_path = 28 [default = ""];
      // Data path of the data table.
      bytes bytes_data_path = 29;
    }
    oneof file_path_option {
      // Path of the data table file.
      string file_path = 30 [default = ""];
      // Path of the data table file.
      bytes bytes_file_path = 31;
    }
  }

  repeated DeployModelOutputAdditionalDataTablesTuple output_additional_data_tables = 32;

  oneof log_file_path_option {
    // Path of the log file for the Khiops process (command line option ``-e`` of the desktop app). If equal to \"\" then it writes no log file.
    string log_file_path = 33 [default = "None"];
    // Path of the log file for the Khiops process (command line option ``-e`` of the desktop app). If equal to \"\" then it writes no log file.
    bytes bytes_log_file_path = 34;
  }

  oneof output_scenario_path_option {
    // Path of the output Khiops scenario file (command line option ``-o`` of the desktop app).  If the empty string is specified no output scenario file is generated.
    string output_scenario_path = 35 [default = "None"];
    // Path of the output Khiops scenario file (command line option ``-o`` of the desktop app).  If the empty string is specified no output scenario file is generated.
    bytes bytes_output_scenario_path = 36;
  }

  oneof task_file_path_option {
    // Path of the task file for the Khiops process (command line option ``-p`` of the desktop app). If equal to \"\" then it writes no task file.
    string task_file_path = 37 [default = "None"];
    // Path of the task file for the Khiops process (command line option ``-p`` of the desktop app). If equal to \"\" then it writes no task file.
    bytes bytes_task_file_path = 38;
  }

  // If True prints the command line executed of the process and does not delete any temporary files created.
  optional bool trace = 39 [default = false];

  oneof stdout_file_path_option {
    // *Advanced* Path to a file where the Khiops process writes its stdout stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    string stdout_file_path = 40 [default = ""];
    // *Advanced* Path to a file where the Khiops process writes its stdout stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    bytes bytes_stdout_file_path = 41;
  }

  oneof stderr_file_path_option {
    // *Advanced* Path to a file where the Khiops process writes its stderr stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    string stderr_file_path = 42 [default = ""];
    // *Advanced* Path to a file where the Khiops process writes its stderr stream. Normally Khiops should not write to this stream but MPI, filesystems plugins or debug versions may do it. The stream is captured with a UTF-8 encoding and replacing encoding errors. If equal to \"\" then it writes no file.
    bytes bytes_stderr_file_path = 43;
  }

  // *Advanced* Maximum number of cores for Khiops executions. If not set, then Khiops uses all available CPU cores in the system.
  optional int32 max_cores = 440;

  // *Advanced* Maximum amount of memory (in MB) for Khiops executions. If not set, then Khiops uses all available system memory.
  optional int32 memory_limit_mb = 450;

  oneof temp_dir_option {
    // *Advanced* Temporary directory for Khiops executions. If set to \"\", then Khiops uses the system's temporary directory.
    string temp_dir = 46 [default = ""];
    // *Advanced* Temporary directory for Khiops executions. If set to \"\", then Khiops uses the system's temporary directory.
    bytes bytes_temp_dir = 47;
  }

  oneof scenario_prologue_option {
    // *Advanced* Prologue to prepend to all Khiops execution scenarios.
    string scenario_prologue = 48 [default = ""];
    // *Advanced* Prologue to prepend to all Khiops execution scenarios.
    bytes bytes_scenario_prologue = 49;
  }

}

/*
 Prepares a *individual-variable* coclustering deployment
 */
message PrepareCoclusteringDeployment {

  oneof dictionary_file_path_option {
    // Path of a Khiops dictionary file.
    string dictionary_file_path = 1 [default = ""];
    // Path of a Khiops dictionary file.
    bytes bytes_dictionary_file_path = 2;
  }

  oneof dictionary_name_option {
    // Name of the dictionary to be analyzed.
    string dictionary_name = 3 [default = ""];
    // Name of the dictionary to be analyzed.
    bytes bytes_dictionary_name = 4;
  }

  oneof coclustering_file_path_option {
    // Path of the coclustering model file (extension ``.khc`` or ``.khcj``).
    string coclustering_file_path = 5 [default = ""];
    // Path of the coclustering model file (extension ``.khc`` or ``.khcj``).
    bytes bytes_coclustering_file_path = 6;
  }

  oneof table_variable_option {
    // Name of the table variable in the dictionary.
    string table_variable = 7 [default = ""];
    // Name of the table variable in the dictionary.
    bytes bytes_table_variable = 8;
  }

  oneof deployed_variable_name_option {
    // Name of the coclustering variable to deploy.
    string deployed_variable_name = 9 [default = ""];
    // Name of the coclustering variable to deploy.
    bytes bytes_deployed_variable_name = 10;
  }

  oneof coclustering_dictionary_file_path_option {
    // Path of the coclustering dictionary file for deployment.
    string coclustering_dictionary_file_path = 11 [default = ""];
    // Path of the coclustering dictionary file for deployment.
    bytes bytes_coclustering_dictionary_file_path = 12;
  }

  // Maximum information preserve in the simplified coclustering. If equal to 0 there is no limit.
  optional int32 max_preserved_information = 13 [default = 0];

  // Maximum number of cells in the simplified coclustering. If equal to 0 there is no limit.
  optional int32 max_cells = 14 [default = 0];

  // Maximum number of parts totaled over all variables. If equal to 0 there is no limit.
  optional int32 max_total_parts = 15 [default = 0];

  // List of tuples associating variable names to their maximum number of parts to preserve in the simplified coclustering. For variables not present in ``max_part_numbers`` there is no limit.
  message PrepareCoclusteringDeploymentMaxPartNumbersTuple {
    oneof name_option {
      // Name of the input coclustering variable.
      string name = 16 [default = ""];
      // Name of the input coclustering variable.
      bytes bytes_name = 17;
    }
    // Max number of parts to keep for this variable.
    optional int32 max_part_number = 18 [default = 0];
  }

  repeated PrepareCoclusteringDeploymentMaxPartNumbersTuple max_part_numbers = 19;

  // If ``True`` includes a cluster id variable in the deployment.
  optional bool build_cluster_variable = 20 [default = true];

  // If ``True`` includes a cluster distance variable in the deployment.
  optional bool build_distance_variables = 21 [default = false];

  // If ``True`` includes the frequency variables in the deployment.
  optional bool build_frequency_variables = 22 [default = false];

