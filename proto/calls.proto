// A call to the Khiops API
message KhiopsApiCall {
    oneof api_calls {
        TrainRecoder train_recoder = 1;
        DeployModel deploy_model = 2;
        PrepareCoclusteringDeployment prepare_coclustering_deployment = 3;
        ExportDictionaryAsJson export_dictionary_as_json = 4;
        ExtractClusters extract_clusters = 5;
        TrainInstanceVariableCoclustering train_instance_variable_coclustering = 6;
        CheckDatabase check_database = 7;
        BuildDictionaryFromDataTable build_dictionary_from_data_table = 8;
        TrainPredictor train_predictor = 9;
        BuildDeployedDictionary build_deployed_dictionary = 10;
        ReinforcePredictor reinforce_predictor = 11;
        ExtractKeysFromDataTable extract_keys_from_data_table = 12;
        EvaluatePredictor evaluate_predictor = 13;
        InterpretPredictor interpret_predictor = 14;
        SortDataTable sort_data_table = 15;
        DetectDataTableFormat detect_data_table_format = 16;
        TrainCoclustering train_coclustering = 17;
        SimplifyCoclustering simplify_coclustering = 18;
    }
}

// A task to be executed by Khiops
// It may be composed of one or more KhiopsApiCalls
message KhiopsTask {
    repeated KhiopsApiCall api_calls = 1;
}